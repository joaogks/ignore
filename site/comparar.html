<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Ignore — três versões</title><style>
*{box-sizing:border-box}body{margin:0;color:#eef3ff;background:#0b1018;font:16px/1.5 system-ui,sans-serif}main{max-width:1660px;margin:auto;padding:clamp(16px,3vw,48px)}header{display:flex;align-items:end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:24px}small{color:#98b7e3;font:12px ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase}h1{font-size:clamp(32px,5.7vw,86px);letter-spacing:-.07em;line-height:.96;margin:10px 0}p{margin:0;color:#aab7ca}.buttons{display:flex;gap:8px}button,a{font:inherit;color:inherit}button{min-height:44px;padding:6px 14px;background:transparent;border:1px solid #415477;border-radius:4px;cursor:pointer}button[aria-pressed=true]{color:#0b1018;background:#b8d5ff}a{color:#b8d5ff}a:focus-visible,button:focus-visible{outline:2px solid #fff;outline-offset:4px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:17px}figure{min-width:0;margin:0}figcaption{display:flex;align-items:baseline;justify-content:space-between;gap:8px;border-top:1px solid #415477;padding:10px 0}figcaption b{font-size:clamp(13px,1.3vw,20px)}figcaption a{white-space:nowrap;font-size:.83em}.screen{height:min(72vh,780px);position:relative;overflow:hidden;background:#080b12;border:1px solid #2c3b52}.screen iframe{position:absolute;top:0;left:0;border:0;transform-origin:top left}.screen,.buttons button{color-scheme:dark}@media(max-width:770px){.grid{grid-template-columns:1fr}.screen{height:66vh}}
</style></head><body><main><header><div><small>Estudo de identidade · João Ignore</small><h1>Três versões do sinal.</h1><p>Role dentro de cada janela ou abra a versão em tamanho real.</p></div><div class="buttons" aria-label="Tamanho da prévia"><button type="button" data-width="1440" aria-pressed="false">Desktop</button><button type="button" data-width="390" aria-pressed="true">Celular</button></div></header><div class="grid">
<figure><figcaption><b>01 / Frequência Fantasma</b><a href="frequencia/index.html">Abrir ↗</a></figcaption><div class="screen"><iframe title="Frequência Fantasma" src="frequencia/index.html"></iframe></div></figure>
<figure><figcaption><b>02 / Arquivo dos Não Encontrados</b><a href="arquivo/index.html">Abrir ↗</a></figcaption><div class="screen"><iframe title="Arquivo dos Não Encontrados" src="arquivo/index.html"></iframe></div></figure>
<figure><figcaption><b>03 / Atlas da Madrugada</b><a href="atlas/index.html">Abrir ↗</a></figcaption><div class="screen"><iframe title="Atlas da Madrugada" src="atlas/index.html"></iframe></div></figure>
</div></main><script>
const screens=[...document.querySelectorAll('.screen')], buttons=[...document.querySelectorAll('[data-width]')];let width=390;
function fit(){for(const s of screens){const frame=s.firstElementChild, scale=Math.min(1,s.clientWidth/width);frame.style.width=width+'px';frame.style.height=Math.ceil(s.clientHeight/scale)+'px';frame.style.transform=`scale(${scale})`;frame.style.left=Math.max(0,(s.clientWidth-width*scale)/2)+'px';}}
for(const b of buttons)b.addEventListener('click',()=>{width=Number(b.dataset.width);for(const n of buttons)n.setAttribute('aria-pressed',String(n===b));fit();});const obs=new ResizeObserver(fit);screens.forEach(s=>obs.observe(s));fit();
</script></body></html>
